            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>

        <button id="palette-toggle" class="palette-toggle" aria-label="Ouvrir la selection de palette" aria-expanded="false">
            <svg viewBox="0 0 24 24">
            <path d="M12 12 L12 2 A10 10 0 0 1 20.66 7 Z" fill="#c94f5c"></path>
            <path d="M12 12 L20.66 7 A10 10 0 0 1 20.66 17 Z" fill="#3f7fd1"></path>
            <path d="M12 12 L20.66 17 A10 10 0 0 1 12 22 Z" fill="#3f9d6c"></path>
            <path d="M12 12 L12 22 A10 10 0 0 1 3.34 17 Z" fill="#d1a13f"></path>
            <path d="M12 12 L3.34 17 A10 10 0 0 1 3.34 7 Z" fill="#9aa3ad"></path>
            <path d="M12 12 L3.34 7 A10 10 0 0 1 12 2 Z" fill="#3fb5c4"></path>
            </svg>
        </button>
        </div>
    </header>

    <div id="overlay" class="overlay"></div>

    <aside id="palette-panel" class="palette-panel" aria-hidden="true">
        <h2 class="palette-panel-title">Palette de couleurs</h2>
        <ul id="palette-list" class="palette-list"></ul>
    </aside>

    <div class="layout">
        <nav class="sidebar">
        <div class="sidebar-subtitle">Bibliothèque de quartier</div>
        <ul class="sidebar-nav">
            <li>
            <a href="/index.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="8" height="8" rx="1.5"></rect>
                <rect x="13" y="3" width="8" height="8" rx="1.5"></rect>
                <rect x="3" y="13" width="8" height="8" rx="1.5"></rect>
                <rect x="13" y="13" width="8" height="8" rx="1.5"></rect>
                </svg>
                Tableau de bord
            </a>
            </li>
            <li>
            <a href="/livres.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v15"></path>
                <path d="M10 20V7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v13"></path>
                <path d="M16 20V9a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v11"></path>
                <line x1="3" y1="20" x2="21" y2="20"></line>
                </svg>
                Livres
            </a>
            </li>
            <li>
            <a href="/auteurs.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 20l4-1 10-10a2 2 0 0 0-3-3L5 16l-1 4z"></path>
                </svg>
                Auteurs
            </a>
            </li>
            <li>
            <a href="/adherents.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="3.2"></circle>
                <path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"></path>
                </svg>
                Adhérents
            </a>
            </li>
            <li>
            <a href="/emprunts.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12a8 8 0 0 1 8-8h5"></path>
                <polyline points="14 1 17 4 14 7"></polyline>
                <path d="M20 12a8 8 0 0 1-8 8H7"></path>
                <polyline points="10 17 7 20 10 23"></polyline>
                </svg>
                Emprunts
            </a>
            </li>
        </ul>
        </nav>

        <main class="main">
        <div class="page-header">
            <h1>Livres</h1>
            <p>Gérez le catalogue de livres de la bibliothèque.</p>
        </div>

        <div id="message"></div>

        <div class="card">
            <h2 id="form-title">Ajouter un livre</h2>
            <form id="livre-form" novalidate>
            <div class="form-row">
                <div class="field">
                <label for="titre">Titre</label>
                <input type="text" id="titre" name="titre" required>
                </div>
                <div class="field">
                <label for="auteur_id">Auteur</label>
                <select id="auteur_id" name="auteur_id" required>
                    <option value="">Sélectionner un auteur</option>
                </select>
                </div>
                <div class="field">
                <label for="annee_publication">Année de publication</label>
                <input type="number" id="annee_publication" name="annee_publication">
                <span id="annee-hint" class="text-muted"></span>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Ajouter le livre</button>
            <button type="button" class="btn-ghost" id="cancel-edit-btn" hidden>Annuler la modification</button>
            </form>
        </div>

        <div class="card">
            <div class="card-header-row">
            <h2>Catalogue</h2>
            <input type="search" id="search-input" class="search-input" placeholder="Rechercher par titre ou auteur...">
            </div>

            <div class="card-header-row sort-row">
            <div class="field field-inline">
                <label for="sort-annee">Trier le catalogue</label>
                <select id="sort-annee">
                <option value="">Ordre alphabétique du titre (A-Z)</option>
                <option value="titre_desc">Titre (Z-A)</option>
                <option value="annee_asc">Année croissante</option>
                <option value="annee_desc">Année décroissante</option>
                </select>
            </div>
            <label class="checkbox-field" for="sort-dispo">
                <input type="checkbox" id="sort-dispo">
                Afficher les disponibles en premier
            </label>
            <button type="button" class="btn-ghost btn-small" id="reset-sort-btn">Réinitialiser le tri</button>
            </div>

            <table>
            <thead>
                <tr>
                <th>Titre</th>
                <th>Auteur</th>
                <th>Année</th>
                <th class="text-center">Statut</th>
                <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody id="livres-tbody"></tbody>
            </table>

            <div id="pagination" class="pagination"></div>
        </div>
        </main>
    </div>

    <button id="scroll-top" class="scroll-top" aria-label="Remonter en haut">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"></path>
        </svg>
    </button>

    <script src="/js/theme.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/livres.js"></script>
</body>
</html>
